# Local development stack — hot-reload on both backend and frontend, source
# mounted as volumes. For a production-like build (no reload, nginx serving
# a static frontend build, multiple backend workers), use
# `docker-compose.prod.yml` instead: `docker compose -f docker-compose.prod.yml up`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: salespilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salespilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salespilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-salespilot}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salespilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: salespilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-salespilot}:${POSTGRES_PASSWORD:-salespilot_dev_password}@postgres:5432/${POSTGRES_DB:-salespilot}
      PLOTS_DIR: /ml-artifacts/prediction/plots
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # SHAP plot PNGs are generated by the separate `ml/` project (see
      # ml_admin.py / prediction.predict), not by this container — mounted
      # so the backend can serve them at /plots/* without needing the ml/
      # toolchain itself. Without this, PLOTS_DIR can never resolve inside
      # the container and every plot request 404s regardless of whether the
      # ML pipeline has actually run.
      - ./ml/artifacts:/ml-artifacts

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: salespilot-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
