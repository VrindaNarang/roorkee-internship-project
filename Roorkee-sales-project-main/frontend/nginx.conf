# Serves the Vite production build as a single-page app: any path that
# isn't a real file falls back to index.html so React Router handles routing
# client-side (e.g. a hard refresh on /customers/42 must still work).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite's build output uses content-hashed filenames (e.g.
    # index-CKkMo45o.js) — safe to cache aggressively since a new deploy
    # always produces new filenames, never reuses an old one with new content.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached — it's what points the browser
    # at the current build's hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
