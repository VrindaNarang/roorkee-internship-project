# Production-like stack: no source-code volume mounts, no hot-reload, the
# frontend is a static build served by nginx, and the backend runs multiple
# uvicorn workers. Run with:
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Requires a real `.env` (copy `.env.example`) with, at minimum, a
# non-default JWT_SECRET_KEY, real Postgres credentials, and a real LLM
# provider key for the Sales Copilot (GROQ_API_KEY or similar) — see
# docs/DEPLOYMENT.md and docs/ENVIRONMENT_VARIABLES.md.
services:
  postgres:
    image: postgres:16-alpine
    container_name: salespilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salespilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      POSTGRES_DB: ${POSTGRES_DB:-salespilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salespilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port mapping — only the backend service needs to reach
    # Postgres, over the compose-internal network.

  backend:
    build:
      context: ./backend
      target: production
    container_name: salespilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-salespilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salespilot}
      ENVIRONMENT: production
      PLOTS_DIR: /ml-artifacts/prediction/plots
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # SHAP plot PNGs are generated by the separate `ml/` project (see
    # PROJECT_SPEC.md §6a), not by this container — mounted read-only so the
    # backend can serve them without needing the `ml/` toolchain itself.
    volumes:
      - ./ml/artifacts:/ml-artifacts:ro

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: salespilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
